<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Proceso de reacción</title>
  <desc id="desc">Ilustración abstracta de un jugador reaccionando a una pelota en una cancha virtual.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f15a3b"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d9d9d2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#171717" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="220" fill="#fff" opacity=".08"/>
  <circle cx="110" cy="800" r="300" fill="#171717" opacity=".12"/>
  <path d="M0 570C230 465 390 700 620 585s350-11 580-120v435H0Z" fill="#171717" opacity=".22"/>
  <g fill="none" stroke="#171717" stroke-width="4" opacity=".28">
    <circle cx="600" cy="450" r="280"/>
    <circle cx="600" cy="450" r="190"/>
    <path d="M600 170v560M320 450h560"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="600" cy="450" r="100" fill="url(#ball)"/>
    <path d="M530 390c45-30 95-35 140-10M550 510c42 22 86 18 120-8" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round" opacity=".75"/>
    <path d="M600 350c-40 18-66 54-73 98M600 550c40-18 66-54 73-98" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round" opacity=".75"/>
  </g>
  <g fill="#171717">
    <circle cx="225" cy="270" r="12"/>
    <circle cx="945" cy="600" r="12"/>
    <circle cx="815" cy="185" r="9"/>
  </g>
  <text x="70" y="95" fill="#171717" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">REACTION / PROCESS</text>
  <text x="70" y="810" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4">OBSERVAR · INTERPRETAR · ACTUAR</text>
</svg>
